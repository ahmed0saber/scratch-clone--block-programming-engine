<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockForge — Visual Block Programming Engine</title>
  <meta name="description" content="A Scratch-inspired visual block programming engine with drag-and-drop, snap-together blocks, and a built-in interpreter." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app">
  <!-- ═══ Header / Toolbar ═══ -->
  <header id="header">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
      </svg>
      BlockForge
    </div>

    <div class="controls">
      <button id="btn-run" class="btn btn-run">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5,3 19,12 5,21" /></svg>
        Run
      </button>
      <button id="btn-stop" class="btn btn-stop">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="4" width="16" height="16" rx="2" /></svg>
        Stop
      </button>
      <button id="btn-projects" class="btn btn-clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        Projects
      </button>
      <button id="btn-export" class="btn btn-clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Export
      </button>
      <button id="btn-import" class="btn btn-clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Import
      </button>
      <button id="btn-clear" class="btn btn-clear">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear
      </button>
    </div>
  </header>

  <!-- ═══ Block Palette ═══ -->
  <aside id="palette"></aside>

  <!-- ═══ Workspace ═══ -->
  <main id="workspace-container">
    <div id="workspace"></div>
    <div id="workspace-info">Zoom: 100%</div>

    <!-- Delete zone (appears when dragging) -->
    <div id="delete-zone">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <line x1="10" y1="11" x2="10" y2="17"/>
        <line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
    </div>
  </main>

  <!-- ═══ Console Panel ═══ -->
  <aside id="console-panel">
    <div class="console-header">
      <div class="dot"></div>
      <span>Output Console</span>
      <button id="btn-clear-console" class="btn btn-clear" style="margin-left:auto; padding:4px 10px; font-size:0.72rem;">
        Clear
      </button>
    </div>
    <div id="console-output"></div>
  </aside>
</div>

<!-- ═══ Projects Modal ═══ -->
<div id="projects-modal" class="modal-overlay hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>My Projects</h2>
      <button id="btn-close-modal" class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="save-section">
        <input type="text" id="project-name-input" placeholder="Enter project name..." class="block-input" style="flex:1; max-width:none; padding:8px 12px;" />
        <button id="btn-save-project" class="btn btn-run" style="border-radius:4px;">Save Current</button>
      </div>
      <div class="project-list-header">Saved Projects</div>
      <div id="project-list" class="project-list">
        <!-- Project items rendered here -->
      </div>
    </div>
  </div>
</div>

<!-- App Scripts (ES Modules) -->
<script type="module" src="js/app.js"></script>

</body>
</html>
